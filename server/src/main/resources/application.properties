spring.application.name=sharebite-server
server.port=${PORT:8080}

# MongoDB Configuration (Supports local Docker or MongoDB Atlas M0 Free Cluster)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/sharebite}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration (Minimum 256-bit key)
sharebite.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
sharebite.jwt.expiration-ms=86400000

# CORS Configuration
sharebite.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Demo Data Seeding (Fictional initial accounts for evaluation)
sharebite.seed-demo-data=${SEED_DEMO_DATA:true}

# Gemini AI Advisory Proxy (Optional - falls back to deterministic safety engine if omitted)
gemini.api.key=${GEMINI_API_KEY:}

# Logging
logging.level.com.sharebite=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO
