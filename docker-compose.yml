version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: sharebite-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=sharebite
    volumes:
      - mongo_data:/data/db
    networks:
      - sharebite-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sharebite-server
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/sharebite
      - SHAREBITE_JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - SHAREBITE_JWT_EXPIRATION_MS=86400000
      - SHAREBITE_SEED_DEMO_DATA=true
      - SHAREBITE_CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
    depends_on:
      - mongodb
    networks:
      - sharebite-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sharebite-client
    restart: on-failure
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - sharebite-network

networks:
  sharebite-network:
    driver: bridge

volumes:
  mongo_data:
